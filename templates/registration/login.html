{% extends "base.html" %}

{% block title %}Log in{% endblock %}

{% block content %}
<article>
  <h2>Log in</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_div }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Log in</button>
  </form>
</article>
{% endblock %}
