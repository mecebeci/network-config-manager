services:
  web:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      # .env may enable DEBUG for runserver; the container always runs without it
      DJANGO_DEBUG: "False"
    volumes:
      - ./data:/app/data
    networks:
      - srlinux-mgmt
    restart: unless-stopped

networks:
  # Created by containerlab (lab/topology.yaml); deploy the lab first
  srlinux-mgmt:
    external: true
